<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ข้อมูลสินทรัพย์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="p-5 mt-5">
      <div class="d-flex justify-content-between ">
        <div>
          <h3>ข้อมูลสินทรัพย์</h3>
        </div>
        <div>
          <a href="#" >ข้อมูลสินทรัพย์ > รายการ</a>
        </div>
      </div>

      <div class="row my-4">
        <div>
            <div class="d-flex flex-row justify-content-between">
                <div class="w-100 text-light p-2" style="background-color: #16277b;">ข้อมูลสินทรัพย์</div>
                <div class="w-100 text-light p-2 text-end" style="background-color: #16277b;"><a href="./">ยกเลิกการแก้ไข</a></div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="inputNo" class="col-sm-2 col-form-label text-end">ทะเบียนเลขที่</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="inputNo">
                </div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="agency" class="col-sm-2 col-form-label text-end">หน่วยงาน</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="agency">
                </div>
            </div>
            <div class="mt-3 mb-3 align-items-center row">
                <label for="date" class="col-sm-2 col-form-label text-end">วันที่ร้องของบประมาณ</label>
                <div class="col-2">
                    <input type="date" class="form-control text-center" id="date">
                </div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="name" class="col-sm-2 col-form-label text-end">ชื่อผู้ร้องของบประมาณ</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="name">
                </div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="regisAt" class="col-sm-2 col-form-label text-end">จดทะเบียนเป็นนิติบุคคล ณ</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="regisAt">
                </div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="address" class="col-sm-2 col-form-label text-end">ที่อยู่สำนักงาน</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="address">
                </div>
            </div>
        </div>
        <div>
            <div class="d-flex flex-row justify-content-between">
                <div class="w-100 text-light p-2" style="background-color: #16277b;">ข้อตกลงซื้อขาย</div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="type" class="col-sm-2 col-form-label text-end">ประเภทสินค้าและบริการ</label>
                <div class="col-sm-7">
                    <input type="text" class="form-control" id="type">
                </div>
            </div>
            <div class="mt-3 mb-3 row align-items-center">
                <label for="noOfType" class="col-sm-2 col-form-label text-end">รายการสินค้าและบริการ</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control text-center" id="noOfType">
                </div>
                <div class="col-auto">
                    <span>รายการ</span>
                </div>
            </div>
            <div class="mt-3 mb-3 align-items-center row align-items-center">
                <label for="total" class="col-sm-2 col-form-label text-end">ราคารวมทั้งสิ้น</label>
                <div class="col-2">
                    <input type="number" class="form-control text-center" id="total">
                </div>
                <div class="col-auto">
                    <span>บาท</span>
                </div>
            </div>
            <div class="mt-3 mb-3 row">
                <label for="guarantee" class="col-sm-2 col-form-label text-end">การรับรองคุณภาพ</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="guarantee">
                </div>
            </div>
        </div>
        <div>
            <div class="d-flex flex-row justify-content-between">
                <div class="w-100 text-light p-2" style="background-color: #16277b;">เอกสารอันเป็นส่วนหนึ่งของสัญญา</div>
            </div>
            <div class="mt-3 mb-3 row align-items-center">
                <label for="noOfType" class="col-sm-2 col-form-label text-end">เอกสาร</label>
                <div class="col-sm-2">
                    <input type="file" class="form-control text-center" id="noOfType">
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-center gap-4 mt-3">
            <button type="button" class="btn btn-primary p-2">บันทึกข้อมูล</button>
            <button type="button" class="btn btn-danger">ลบข้อมูล</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
