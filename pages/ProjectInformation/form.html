<div class="p-5 mt-5">
    <div class="d-flex justify-content-between ">
    <div>
        <h3>ข้อมูลโครงการ</h3>
    </div>
    <div>
        <a href="#">ข้อมูลโครงการ > รายการ</a>
    </div>
    </div>

    <div class="row my-4">
    <div>
        <div class="d-flex flex-row justify-content-between">
            <div class="w-100 text-light p-2" style="background-color: #16277b;">ข้อมูลโครงการ</div>
            <div class="w-100 text-light p-2 text-end" style="background-color: #16277b;"><a href="#" onclick="loadPage('./pages/ProjectInformation')">ยกเลิกการแก้ไข</a></div>
        </div>
        <div class="mt-3 mb-3 row">
            <label for="name" class="col-2 col-form-label text-end">ชื่อโครงการ</label>
            <div class="col-8">
                <input type="text" class="form-control" id="name">
            </div>
        </div>
        <div class="mt-3 mb-3 row">
            <label for="type" class="col-2 col-form-label text-end">ประเภท</label>
            <div class="col-2">
                <select class="form-select" id="type" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                    </select>
            </div>
        </div>
    </div>
    <div>
        <div class="d-flex flex-row justify-content-between">
            <div class="w-100 text-light p-2" style="background-color: #16277b;">งบประมาณโครงการ</div>
        </div>
        <div class="mt-3 mb-3 row">
            <label for="disbursement" class="col-2 col-form-label text-end">การเบิกจ่ายเงิน</label>
            <div class="col-4">
                <select class="form-select" id="disbursement" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                    </select>
            </div>
            <div class="col-6"></div><div class="col-2"></div>
            <div class="col-8 mt-3">
                <textarea class="form-control"></textarea>
            </div>
        </div>
        <div class="mt-3 mb-3 row align-items-center">
            <label for="budgetProject" class="col-2 col-form-label text-end">งบประมาณโครงการ</label>
            <div class="col-4">
                <select class="form-select" id="budgetProject" aria-label="Default select example">
                    <option selected>Open this select menu</option>
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                    </select>
            </div>
        </div>
        <div class="mt-3 mb-3 align-items-center row align-items-center">
            <label for="in" class="col-2 col-form-label text-end">จำนวนเงินงบประมาณใน พรบ.รายจ่าย</label>
            <div class="col-4">
                <input type="number" class="form-control text-center" id="in">
            </div>
            <div class="col-auto">
                <span>บาท</span>
            </div>
        </div>
        <div class="mt-3 mb-3 align-items-center row align-items-center">
            <label for="out" class="col-2 col-form-label text-end">จำนวนเงินงบประมาณนอก พรบ.รายจ่าย</label>
            <div class="col-4">
                <input type="number" class="form-control text-center" id="out">
            </div>
            <div class="col-auto">
                <span>บาท</span>
            </div>
        </div>
        <div class="mt-3 mb-3 align-items-center row align-items-center">
            <label class="col-2 col-form-label text-end">กำหนดเป็นสกุลเงิน</label>
            <div class="col-2">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                    <label class="form-check-label" for="inlineRadio1">บาท</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                    <label class="form-check-label" for="inlineRadio2">เงินต่างประเทศ</label>
                </div>
            </div>
        </div>
    </div>
    <div>
        <div class="d-flex flex-row justify-content-between">
            <div class="w-100 text-light p-2" style="background-color: #16277b;">รายการสินค้า</div>
        </div>
        <div class="mt-3 mb-3 row align-items-center">
            <label for="noOfType" class="col-2 col-form-label text-end">รายการสินค้าและบริการ</label>
            <div class="col-2">
                <input type="text" class="form-control text-center" id="noOfType">
            </div>
            <div class="col-auto">
                <span>รายการ</span>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-center gap-4 mt-3">
        <button type="button" class="btn btn-primary p-2">บันทึกข้อมูล</button>
        <button type="button" class="btn btn-danger">ลบข้อมูล</button>
    </div>
    </div>
</div>
